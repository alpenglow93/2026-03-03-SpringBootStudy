# port 결정 = default 8080 = 9090
server:
  port: 9090
  servlet:
    context-path: /
spring:
  datasource:
    postgres:
      jdbc-url: ${POST_URL}
      username: postgres
      password: 1234
      driver-class-name: org.postgresql.Driver
    oracle:
      jdbc-url: ${TEAMDB_URL}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: oracle.jdbc.driver.OracleDriver
  thymeleaf:
    cache: false
    encoding: UTF-8
    prefix: classpath:templates/
    suffix: .html
    mode: HTML
  ai:
    google:
      genai:
        embedding:
          api-key: ${GEN_KEY}
          project-id: gen-lang-client-0827057715s
          text:
            model: gemini-embedding-001
            dimensions: 768
    model:
      embedding:
        text: google-genai
      

# mybatis
mybatis:
  type-aliases-package: com.sist.web.vo
  mapper-locations:
    - classpath:/mapper/postgres/*.xml
    - classpath:/mapper/oracle/*.xml
  configuration:
    map-underscore-to-camel-case: true
  
